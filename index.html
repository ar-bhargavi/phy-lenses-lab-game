<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>🔬 Lenses Lab — Grade X Physics</title>
<style>
  :root{
    --bg:#0f1724; --panel:#172231; --ink:#e6edf3; --muted:#8aa0b4;
    --accent:#4cc9f0; --good:#2ecc71; --bad:#ff6b6b; --warn:#f4d35e;
    --ray1:#ff9f1c; --ray2:#2ec4b6; --ray3:#e71d36;
    --obj:#ffd166; --real:#4cc9f0; --virt:#b388ff;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);}
  header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;
         background:linear-gradient(90deg,#1b2a3d,#0f1724);border-bottom:1px solid #243447;}
  header h1{margin:0;font-size:20px;letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  .stats{font-size:14px;color:var(--muted)}
  .stats b{color:var(--ink)}
  .layout{display:grid;grid-template-columns:1fr 300px;gap:14px;padding:14px;}
  @media(max-width:1000px){.layout{grid-template-columns:1fr}}
  .bench-wrap{background:var(--panel);border-radius:12px;padding:10px;
              box-shadow:0 4px 18px rgba(0,0,0,.4);}
  svg{width:100%;height:auto;display:block;background:#0b1220;border-radius:8px;}
  .side{display:flex;flex-direction:column;gap:12px;}
  .card{background:var(--panel);border-radius:12px;padding:14px;
        box-shadow:0 4px 18px rgba(0,0,0,.4);}
  .card h3{margin:0 0 10px;font-size:14px;color:var(--accent);
           text-transform:uppercase;letter-spacing:1px;}
  .row{display:flex;align-items:center;justify-content:space-between;margin:6px 0;font-size:13px;}
  .row label{color:var(--muted)}
  .row b{color:var(--ink);font-variant-numeric:tabular-nums}
  button{background:#243447;color:var(--ink);border:1px solid #2f4359;
         padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;
         transition:.2s;}
  button:hover{background:#2f4359;border-color:var(--accent)}
  button.active{background:var(--accent);color:#0b1220;border-color:var(--accent)}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .formula{font-family:'Cambria Math','Times New Roman',serif;font-size:15px;
           background:#0b1220;padding:8px 10px;border-radius:6px;
           border-left:3px solid var(--accent);margin-top:6px;}
  .nature{padding:8px;border-radius:6px;background:#0b1220;font-size:13px;
          border-left:3px solid var(--good);margin-top:6px;line-height:1.5}
  .challenge{background:linear-gradient(135deg,#1b2a3d,#0f1724);
             border:1px dashed var(--warn);padding:10px;border-radius:8px;
             font-size:13px;margin-bottom:8px}
  .challenge b{color:var(--warn)}
  .feedback{margin-top:8px;padding:8px;border-radius:6px;font-size:13px;
            text-align:center;font-weight:600;min-height:32px}
  .feedback.good{background:rgba(46,204,113,.15);color:var(--good)}
  .feedback.bad{background:rgba(255,107,107,.15);color:var(--bad)}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:15px;color:var(--ink);
          margin-top:10px;padding:8px 10px;background:#0b1220;border-radius:8px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-weight:500}
  .dot{width:14px;height:14px;border-radius:50%;display:inline-block;
       box-shadow:0 0 6px currentColor;}
  .handle{cursor:grab}
  .handle:active{cursor:grabbing}
  .axis{stroke:#2f4359;stroke-width:1;stroke-dasharray:4 4}
  .lens{fill:rgba(130,200,240,0.55);stroke:#1a6fa0;stroke-width:2;stroke-linejoin:round}
  .object-line{stroke:var(--obj);stroke-width:3}
  .image-line{stroke-width:3}
  .screen-rect{fill:rgba(255,255,255,.08);stroke:#fff;stroke-width:1.5;stroke-dasharray:3 3}
  .ray{fill:none;stroke-width:1.8;opacity:.85}
  .ray.dashed{stroke-dasharray:5 4;opacity:.55}
  .focus-mark{fill:var(--warn);font-size:11px;font-weight:700}
  .label{fill:var(--muted);font-size:11px}
  .tip{font-size:11px;color:var(--muted);line-height:1.4;margin-top:6px}
  
  /* NEW: Instruction Box Styles */
  .instruction-box{
    background:linear-gradient(135deg,rgba(76,201,240,0.15),rgba(26,111,160,0.1));
    border-left:4px solid var(--accent);
    padding:12px 16px;
    border-radius:8px;
    margin-bottom:12px;
    font-size:14px;
    line-height:1.5;
    color:var(--ink);
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
  }
  .instruction-box b{color:var(--warn)}
  .instruction-box .hint{
    display:block;
    margin-top:6px;
    font-size:12px;
    color:var(--muted);
    font-style:italic;
  }

  /* Portrait mode overlay */
  #portraitWarning{
    display:none;position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(15,23,36,0.98);z-index:9999;flex-direction:column;
    justify-content:center;align-items:center;text-align:center;padding:20px;
  }
  #portraitWarning.show{display:flex}
  #portraitWarning .icon{font-size:64px;margin-bottom:20px}
  #portraitWarning h2{color:var(--accent);margin:0 0 16px;font-size:24px}
